<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<body>

<h2>Login Page</h2>

<div th:if="${param.error}">
    Invalid username or password
</div>

<div th:if="${param.logout}">
    Logged out successfully
</div>

<form action="/login" method="post">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <button type="submit">
        Login
    </button>

</form>

</body>
</html>
