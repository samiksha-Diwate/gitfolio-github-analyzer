<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>GitFolio</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0d1117;
            color:white;
            min-height:100vh;
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            font-size:45px;
            color:#58a6ff;
        }

        form{
            display:flex;
            justify-content:center;
            gap:10px;
            margin-bottom:40px;
        }

        input{
            padding:14px;
            width:300px;
            border:none;
            border-radius:10px;
            outline:none;
            font-size:16px;
        }

        button{
            padding:14px 20px;
            border:none;
            border-radius:10px;
            background:#238636;
            color:white;
            cursor:pointer;
            font-size:16px;
            transition:0.3s;
        }

        button:hover{
            background:#2ea043;
            transform:scale(1.05);
        }

        .profile-card{
            background:#161b22;
            padding:30px;
            border-radius:20px;
            width:400px;
            margin:0 auto 40px auto;
            text-align:center;
            box-shadow:0 0 15px rgba(0,0,0,0.5);
        }

        .profile-card img{
            width:140px;
            border-radius:50%;
            margin-bottom:20px;
            border:4px solid #58a6ff;
        }

        .profile-card h2{
            margin-bottom:10px;
        }

        .stats{
            display:flex;
            justify-content:space-around;
            margin-top:20px;
        }

        .stat-box{
            background:#21262d;
            padding:15px;
            border-radius:10px;
            width:100px;
        }

        .repo-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:20px;
            margin-top:30px;
        }

        .repo-card{
            background:#161b22;
            padding:20px;
            border-radius:15px;
            transition:0.3s;
            box-shadow:0 0 10px rgba(0,0,0,0.4);
        }

        .repo-card:hover{
            transform:translateY(-5px);
        }

        .repo-card h3{
            color:#58a6ff;
            margin-bottom:15px;
        }

        .repo-card p{
            margin-bottom:10px;
        }

        a{
            text-decoration:none;
            color:white;
        }

        .error{
            text-align:center;
            color:red;
            margin-bottom:20px;
            font-size:18px;
        }

    </style>

</head>

<body>

<h1>GitFolio</h1>

<form th:action="@{/search}" method="post">

    <input type="text"
           name="username"
           placeholder="Enter GitHub Username"
           required>

    <button type="submit">
        Search
    </button>

</form>

<div class="error"
     th:if="${error}"
     th:text="${error}">
</div>

<div class="profile-card"
     th:if="${user}">

    <img th:src="${user.avatar_url}">

    <h2 th:text="${user.name}"></h2>

    <p th:text="${user.bio}"></p>

    <br>

    <p>
        📍
        <span th:text="${user.location}"></span>
    </p>

    <br>

    <a th:href="${user.html_url}" target="_blank">
        Visit GitHub Profile
    </a>

    <div class="stats">

        <div class="stat-box">
            <h3 th:text="${user.followers}"></h3>
            <p>Followers</p>
        </div>

        <div class="stat-box">
            <h3 th:text="${user.following}"></h3>
            <p>Following</p>
        </div>

        <div class="stat-box">
            <h3 th:text="${user.public_repos}"></h3>
            <p>Repos</p>
        </div>

    </div>

</div>

<div class="repo-container">

    <div class="repo-card"
         th:each="repo : ${repositories}">

        <h3 th:text="${repo.name}"></h3>

        <p>
            💻 Language:
            <span th:text="${repo.language}"></span>
        </p>

        <p>
            ⭐ Stars:
            <span th:text="${repo.stargazers_count}"></span>
        </p>

        <p>
            🍴 Forks:
            <span th:text="${repo.forks_count}"></span>
        </p>

        <a th:href="${repo.html_url}"
           target="_blank">

            Open Repository →

        </a>

    </div>

</div>

</body>
</html>
