<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>GitFolio</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            font-family: Arial;
            background:#0d1117;
            color:white;
            margin:0;
            padding:0;
        }

        .container{
            width:90%;
            margin:auto;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#58a6ff;
        }

        form{
            text-align:center;
            margin-top:30px;
        }

        input{
            padding:10px;
            width:300px;
            border:none;
            border-radius:5px;
        }

        button{
            padding:10px 20px;
            background:#238636;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .profile{
            margin-top:40px;
            background:#161b22;
            padding:20px;
            border-radius:10px;
        }

        .profile img{
            width:120px;
            border-radius:50%;
        }

        .repos{
            margin-top:30px;
        }

        .repo-card{
            background:#161b22;
            padding:15px;
            margin-bottom:15px;
            border-radius:10px;
        }

        .repo-card a{
            color:#58a6ff;
            text-decoration:none;
            font-size:20px;
            font-weight:bold;
        }

        .charts{
            display:flex;
            gap:30px;
            margin-top:40px;
            flex-wrap:wrap;
        }

        .chart-box{
            background:#161b22;
            padding:20px;
            border-radius:10px;
            width:450px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>GitFolio - GitHub Analyzer</h1>

    <form action="/search" method="post">

        <input type="text"
               name="username"
               placeholder="Enter GitHub Username"
               required>

        <button type="submit">
            Search
        </button>

    </form>

    <div th:if="${error}">
        <h3 th:text="${error}" style="color:red;"></h3>
    </div>

    <div class="profile" th:if="${user}">

        <img th:src="${user.avatar_url}" alt="avatar">

        <h2 th:text="${user.name}"></h2>

        <p>
            Username:
            <span th:text="${user.login}"></span>
        </p>

        <p>
            Followers:
            <span th:text="${user.followers}"></span>
        </p>

        <p>
            Following:
            <span th:text="${user.following}"></span>
        </p>

        <p>
            Public Repositories:
            <span th:text="${user.public_repos}"></span>
        </p>

    </div>

    <div class="charts" th:if="${repositories}">

        <div class="chart-box">
            <canvas id="starsChart"></canvas>
        </div>

        <div class="chart-box">
            <canvas id="languageChart"></canvas>
        </div>

    </div>

    <div class="repos" th:if="${repositories}">

        <h2>Repositories</h2>

        <div class="repo-card"
             th:each="repo : ${repositories}">

            <a th:href="${repo.html_url}"
               target="_blank"
               th:text="${repo.name}">
            </a>

            <p th:text="${repo.description}"></p>

            <p>
                ⭐ Stars:
                <span th:text="${repo.stargazers_count}"></span>
            </p>

            <p>
                🍴 Forks:
                <span th:text="${repo.forks_count}"></span>
            </p>

            <p>
                💻 Language:
                <span th:text="${repo.language}"></span>
            </p>

        </div>

    </div>

</div>

<script th:inline="javascript">

    let repos = [[${repositories}]];

    if(repos){

        let repoNames = [];
        let stars = [];

        let languageMap = {};

        repos.forEach(repo => {

            repoNames.push(repo.name);
            stars.push(repo.stargazers_count);

            if(repo.language){

                if(languageMap[repo.language]){

                    languageMap[repo.language]++;

                }else{

                    languageMap[repo.language] = 1;
                }
            }

        });

        new Chart(document.getElementById('starsChart'), {

            type: 'bar',

            data: {

                labels: repoNames,

                datasets: [{

                    label: 'Stars',

                    data: stars

                }]
            }

        });

        new Chart(document.getElementById('languageChart'), {

            type: 'pie',

            data: {

                labels: Object.keys(languageMap),

                datasets: [{

                    data: Object.values(languageMap)

                }]
            }

        });

    }

</script>

</body>
</html>
