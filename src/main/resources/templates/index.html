<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>GitFolio</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background:#0d1117;
            color:white;
        }

        .container{
            width:80%;
            margin:auto;
            text-align:center;
            padding-top:40px;
        }

        h1{
            color:#58a6ff;
            font-size:55px;
        }

        p{
            color:#c9d1d9;
        }

        form{
            margin-top:30px;
        }

        input{
            width:300px;
            padding:12px;
            border:none;
            border-radius:10px;
            font-size:16px;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:10px;
            background:#238636;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#2ea043;
        }

        .card{
            background:#161b22;
            margin-top:40px;
            padding:30px;
            border-radius:20px;
        }

        img{
            width:150px;
            border-radius:50%;
            border:4px solid #58a6ff;
        }

        .repo-section{
            margin-top:40px;
        }

        .repo-card{
            background:#21262d;
            padding:20px;
            margin-top:20px;
            border-radius:15px;
            text-align:left;
        }

        .repo-card h3{
            margin-top:0;
        }

        a{
            color:#58a6ff;
            text-decoration:none;
        }

        a:hover{
            text-decoration:underline;
        }

        .error{
            color:red;
            margin-top:20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>GitFolio</h1>

    <p>
        Analyze GitHub Profiles Instantly 🚀
    </p>

    <form action="/search" method="post">

        <input type="text"
               name="username"
               placeholder="Enter GitHub Username"
               required>

        <button type="submit">
            Search
        </button>

    </form>

    <p class="error"
       th:text="${error}">
    </p>

    <!-- USER CARD -->

    <div class="card"
         th:if="${user != null}">

        <img th:src="${user.avatar_url}"
             alt="Profile Image">

        <h2 th:text="${user.name}">
        </h2>

        <p th:text="${user.bio}">
        </p>

        <p>
            Followers:
            <span th:text="${user.followers}"></span>
        </p>

        <p>
            Following:
            <span th:text="${user.following}"></span>
        </p>

        <p>
            Public Repositories:
            <span th:text="${user.public_repos}"></span>
        </p>

    </div>

    <!-- REPOSITORIES -->

    <div class="repo-section"
         th:if="${repositories != null}">

        <h2>
            Repositories
        </h2>

        <div class="repo-card"
             th:each="repo : ${repositories}">

            <h3>

                <a th:href="${repo.html_url}"
                   target="_blank"
                   th:text="${repo.name}">
                </a>

            </h3>

            <p th:text="${repo.description}">
            </p>

            <p>
                ⭐ Stars:
                <span th:text="${repo.stargazers_count}"></span>
            </p>

            <p>
                🍴 Forks:
                <span th:text="${repo.forks_count}"></span>
            </p>

        </div>

    </div>

</div>

</body>

</html>
